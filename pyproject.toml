[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpenet-reproducibility"
version = "0.1.0"
description = "Reproducible MLPEnet experiments for Levy-driven SDE parameter estimation"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.2,<2.6",
  "numpy>=1.24,<2.2",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tensorboard>=2.14",
]

[tool.setuptools.packages.find]
include = ["mlpenet*"]
